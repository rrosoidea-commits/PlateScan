<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" width="1320" height="820" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">License plate detector pipeline</title>
<desc id="desc">Preprocessing, YOLO26n model training, and output stages of the license plate detection project, with the real dataset counts and test results.</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<linearGradient id="train-grad" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
</defs>
<rect width="1320" height="820" fill="#ffffff"/>
<text x="660.0" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">License Plate Detector · Preprocessing &amp; Training Pipeline</text>
<text x="660.0" y="70" text-anchor="middle" font-size="14" fill="#64748b">Ultralytics YOLO26n trained on a Roboflow license plate dataset · single class: license</text>
<rect x="24" y="88" width="352" height="658" rx="18" fill="#f5f9ff" stroke="#93c5fd" stroke-opacity="0.6" stroke-width="1.2"/>
<rect x="40" y="100" width="320" height="30" rx="15" fill="#2563eb"/>
<text x="200.0" y="120" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ffffff">1 · PREPROCESSING</text>
<g filter="url(#shadow)"><rect x="40" y="140" width="320" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/></g>
<circle cx="64" cy="164" r="12" fill="#2563eb"/>
<text x="64" y="168.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="84" y="169" font-size="15" font-weight="700" fill="#1d4ed8">Raw dataset</text>
<text x="56" y="194" font-size="12.5" fill="#334155">Roboflow export · 16,908 images, 1 class</text>
<text x="56" y="212" font-size="12.5" fill="#334155">Auto-orient + resize to 640×640 (stretch)</text>
<text x="56" y="230" font-size="12.5" fill="#334155">Pre-augmented: rotation, blur, noise</text>
<line x1="200.0" y1="242" x2="200.0" y2="259" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<g filter="url(#shadow)"><rect x="40" y="262" width="320" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/></g>
<circle cx="64" cy="286" r="12" fill="#2563eb"/>
<text x="64" y="290.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="84" y="291" font-size="15" font-weight="700" fill="#1d4ed8">Data cleaning</text>
<text x="56" y="316" font-size="12.5" fill="#334155">data.yaml: absolute path + relative splits</text>
<text x="56" y="334" font-size="12.5" fill="#334155">797 label files mixing polygons &amp; boxes</text>
<text x="56" y="352" font-size="12.5" fill="#334155">→ polygons converted to bounding boxes</text>
<line x1="200.0" y1="364" x2="200.0" y2="381" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<g filter="url(#shadow)"><rect x="40" y="384" width="320" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/></g>
<circle cx="64" cy="408" r="12" fill="#2563eb"/>
<text x="64" y="412.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<text x="84" y="413" font-size="15" font-weight="700" fill="#1d4ed8">Missing labels check</text>
<text x="56" y="438" font-size="12.5" fill="#334155">0 images without a label file</text>
<text x="56" y="456" font-size="12.5" fill="#334155">10 empty labels kept as background</text>
<text x="56" y="474" font-size="12.5" fill="#334155">292 of 20,469 plates tiny (&lt; 20 px)</text>
<line x1="200.0" y1="486" x2="200.0" y2="503" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<g filter="url(#shadow)"><rect x="40" y="506" width="320" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/></g>
<circle cx="64" cy="530" r="12" fill="#2563eb"/>
<text x="64" y="534.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
<text x="84" y="535" font-size="15" font-weight="700" fill="#1d4ed8">Normalization &amp; encoding</text>
<text x="56" y="560" font-size="12.5" fill="#334155">Boxes: class + (x, y, w, h) scaled 0–1</text>
<text x="56" y="578" font-size="12.5" fill="#334155">Pixels scaled 0–1 by the YOLO loader</text>
<text x="56" y="596" font-size="12.5" fill="#334155">One class → index 0 (“license”)</text>
<line x1="200.0" y1="608" x2="200.0" y2="625" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
<g filter="url(#shadow)"><rect x="40" y="628" width="320" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/></g>
<circle cx="64" cy="652" r="12" fill="#2563eb"/>
<text x="64" y="656.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
<text x="84" y="657" font-size="15" font-weight="700" fill="#1d4ed8">Train / valid / test split</text>
<text x="56" y="682" font-size="12.5" fill="#334155">15,160 train (89.7%)</text>
<text x="56" y="700" font-size="12.5" fill="#334155">1,155 valid (6.8%) · 593 test (3.5%)</text>
<text x="56" y="718" font-size="12.5" fill="#334155">Kept as exported (Roboflow split)</text>
<rect x="484" y="88" width="352" height="658" rx="18" fill="#fbfaff" stroke="#c4b5fd" stroke-opacity="0.6" stroke-width="1.2"/>
<rect x="500" y="100" width="320" height="30" rx="15" fill="url(#train-grad)"/>
<text x="660.0" y="120" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ffffff">2 · MODEL TRAINING</text>
<g filter="url(#shadow)"><rect x="500" y="140" width="320" height="100" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/></g>
<circle cx="524" cy="164" r="12" fill="#ea580c"/>
<text x="524" y="168.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="544" y="169" font-size="15" font-weight="700" fill="#c2410c">Feature input</text>
<text x="516" y="194" font-size="12.5" fill="#334155">640×640 RGB images, batch size 8</text>
<text x="516" y="212" font-size="12.5" fill="#334155">1 data-loading worker (8 GB RAM)</text>
<text x="516" y="230" font-size="12.5" fill="#334155">NVIDIA RTX 2050 (4 GB) · CUDA 12.8</text>
<line x1="660.0" y1="242" x2="660.0" y2="259" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
<g filter="url(#shadow)"><rect x="500" y="262" width="320" height="100" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/></g>
<circle cx="524" cy="286" r="12" fill="#ea580c"/>
<text x="524" y="290.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="544" y="291" font-size="15" font-weight="700" fill="#c2410c">Model initialization</text>
<text x="516" y="316" font-size="12.5" fill="#334155">YOLO26n · 2.4 M parameters</text>
<text x="516" y="334" font-size="12.5" fill="#334155">COCO-pretrained (transfer learning)</text>
<text x="516" y="352" font-size="12.5" fill="#334155">Seed 42 · deterministic</text>
<line x1="660.0" y1="364" x2="660.0" y2="381" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
<g filter="url(#shadow)"><rect x="500" y="384" width="320" height="100" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/></g>
<circle cx="524" cy="408" r="12" fill="#7c3aed"/>
<text x="524" y="412.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<text x="544" y="413" font-size="15" font-weight="700" fill="#6d28d9">Training loop (per epoch)</text>
<text x="516" y="438" font-size="12.5" fill="#334155">Up to 50 epochs · early-stop patience 15</text>
<text x="516" y="456" font-size="12.5" fill="#334155">Augment: mosaic, HSV, flip, shift, scale</text>
<text x="516" y="474" font-size="12.5" fill="#334155">Mosaic off for the last 10 epochs</text>
<line x1="660.0" y1="486" x2="660.0" y2="503" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
<g filter="url(#shadow)"><rect x="500" y="506" width="320" height="100" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/></g>
<circle cx="524" cy="530" r="12" fill="#7c3aed"/>
<text x="524" y="534.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
<text x="544" y="535" font-size="15" font-weight="700" fill="#6d28d9">Loss evaluation</text>
<text x="516" y="560" font-size="12.5" fill="#334155">Train: box loss + cls loss + L1 loss</text>
<text x="516" y="578" font-size="12.5" fill="#334155">Validate each epoch: P, R, mAP50, mAP50-95</text>
<text x="516" y="596" font-size="12.5" fill="#334155">Val loss falls to the end → no overfitting</text>
<line x1="660.0" y1="608" x2="660.0" y2="625" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
<g filter="url(#shadow)"><rect x="500" y="628" width="320" height="100" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/></g>
<circle cx="524" cy="652" r="12" fill="#7c3aed"/>
<text x="524" y="656.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
<text x="544" y="657" font-size="15" font-weight="700" fill="#6d28d9">Model selection</text>
<text x="516" y="682" font-size="12.5" fill="#334155">Best epoch 47 of 50 (val mAP50-95 0.816)</text>
<text x="516" y="700" font-size="12.5" fill="#334155">Hyperparameters: Ultralytics defaults</text>
<text x="516" y="718" font-size="12.5" fill="#334155">Training time: 4.42 h</text>
<rect x="944" y="88" width="352" height="658" rx="18" fill="#f6fdf9" stroke="#6ee7b7" stroke-opacity="0.6" stroke-width="1.2"/>
<rect x="960" y="100" width="320" height="30" rx="15" fill="#059669"/>
<text x="1120.0" y="120" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ffffff">3 · OUTPUT</text>
<g filter="url(#shadow)"><rect x="960" y="140" width="320" height="100" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/></g>
<circle cx="984" cy="164" r="12" fill="#059669"/>
<text x="984" y="168.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
<text x="1004" y="169" font-size="15" font-weight="700" fill="#047857">Trained model artifact</text>
<text x="976" y="194" font-size="12.5" fill="#334155">best.pt · 5.3 MB</text>
<text x="976" y="212" font-size="12.5" fill="#334155">outputs/yolo26n_640_e50_best.pt</text>
<text x="976" y="230" font-size="12.5" fill="#334155">+ metrics.json, metrics_summary.csv</text>
<line x1="1120.0" y1="242" x2="1120.0" y2="259" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<g filter="url(#shadow)"><rect x="960" y="262" width="320" height="100" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/></g>
<circle cx="984" cy="286" r="12" fill="#059669"/>
<text x="984" y="290.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
<text x="1004" y="291" font-size="15" font-weight="700" fill="#047857">Test metrics · 593 images</text>
<text x="976" y="316" font-size="12.5" fill="#334155">Precision 0.985 · Recall 0.926 · F1 0.955</text>
<text x="976" y="334" font-size="12.5" fill="#334155">mAP@0.5 0.946 · mAP@0.5:0.95 0.792</text>
<text x="976" y="352" font-size="12.5" fill="#334155">743 ground-truth plates</text>
<line x1="1120.0" y1="364" x2="1120.0" y2="381" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<g filter="url(#shadow)"><rect x="960" y="384" width="320" height="100" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/></g>
<circle cx="984" cy="408" r="12" fill="#059669"/>
<text x="984" y="412.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
<text x="1004" y="413" font-size="15" font-weight="700" fill="#047857">Error analysis</text>
<text x="976" y="438" font-size="12.5" fill="#334155">Conf ≥ 0.25, IoU ≥ 0.5</text>
<text x="976" y="456" font-size="12.5" fill="#334155">699 found · 44 missed · 32 false positives</text>
<text x="976" y="474" font-size="12.5" fill="#334155">Misses: tiny plates, box-style mismatch</text>
<line x1="1120.0" y1="486" x2="1120.0" y2="503" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<g filter="url(#shadow)"><rect x="960" y="506" width="320" height="100" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/></g>
<circle cx="984" cy="530" r="12" fill="#059669"/>
<text x="984" y="534.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
<text x="1004" y="535" font-size="15" font-weight="700" fill="#047857">Inference speed</text>
<text x="976" y="560" font-size="12.5" fill="#334155">16.1 ms per image → 62 FPS</text>
<text x="976" y="578" font-size="12.5" fill="#334155">Batch size 1, RTX 2050</text>
<text x="976" y="596" font-size="12.5" fill="#334155">Pre + inference + postprocess</text>
<line x1="1120.0" y1="608" x2="1120.0" y2="625" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-green)"/>
<g filter="url(#shadow)"><rect x="960" y="628" width="320" height="100" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/></g>
<circle cx="984" cy="652" r="12" fill="#059669"/>
<text x="984" y="656.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
<text x="1004" y="657" font-size="15" font-weight="700" fill="#047857">Plate reading (OCR stage)</text>
<text x="976" y="682" font-size="12.5" fill="#334155">fast-plate-ocr cct-xs-v2 · ~3 ms / plate</text>
<text x="976" y="700" font-size="12.5" fill="#334155">20/23 exact · 98% characters (sample)</text>
<text x="976" y="718" font-size="12.5" fill="#334155">Detect + read pipeline: 42 FPS</text>
