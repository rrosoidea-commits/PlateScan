<text x="406.2" y="787" font-size="13" fill="#334155">Training: data &amp; model setup</text>
<rect x="649.4000000000001" y="775" width="14" height="14" rx="4" fill="#7c3aed"/>
<text x="671.4000000000001" y="787" font-size="13" fill="#334155">Training: learning loop</text>
<rect x="877.6000000000001" y="775" width="14" height="14" rx="4" fill="#059669"/>
<text x="899.6000000000001" y="787" font-size="13" fill="#334155">Outputs &amp; evaluation</text>
<text x="660.0" y="812" text-anchor="middle" font-size="11.5" fill="#94a3b8">Test metrics on the held-out test split (593 images). OCR accuracy from 23 hand-labeled plate crops.</text>
